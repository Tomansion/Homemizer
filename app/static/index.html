<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Residence Optimizer</title>
<meta name="description" content="Find the best place to live: score candidate homes by the total time you would spend commuting each week." />
<link rel="icon" href="/icon.png" />
<link rel="apple-touch-icon" href="/icon.png" />
<meta name="theme-color" content="#6BB5FF" />
<!-- Leaflet is vendored rather than loaded from a CDN: one less third party
     that can go down, change, or watch our visitors. -->
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
<style>
  :root {
    /* Taken from the app icon: a blue house, a green dot, heavy black outline.
       Green is the "how good is this" colour — it is where the score ramp ends
       — so homes wear it and targets take the blue, rather than having green
       mean both "a place you go to" and "the best home". */
    --blue: #a4d2ff; --green: #19FF6D; --ink: #12161c;
    --bg: #f4f8fd; --panel: #fff; --border: #dce3ec; --text: var(--ink);
    --muted: #5d6774; --accent: var(--blue);
    --target: var(--blue); --living: var(--green); --cog: var(--ink);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: var(--text); }
  #app { display: flex; height: 100vh; }
  body { background: var(--bg); }
  #sidebar { width: 360px; min-width: 360px; background: var(--panel); border-right: 2px solid var(--ink);
             display: flex; flex-direction: column; overflow: hidden; }
  #map { flex: 1; }
  header { padding: 14px 16px; border-bottom: 2px solid var(--ink); }
  header h1 { margin: 0; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  header h1 img { width: 24px; height: 25px; }
  header p { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
  .scroll { flex: 1; overflow-y: auto; padding: 12px 16px; }
  .section-title { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
                   margin: 18px 0 8px; display: flex; justify-content: space-between; align-items: center; }
  .search { position: relative; display: flex; gap: 8px; }
  .search input { flex: 1; min-width: 0; padding: 9px 10px; border: 2px solid var(--ink); border-radius: 8px; font-size: 14px; }
  .search input:focus { outline: 2px solid var(--blue); outline-offset: 1px; }
  .search button { padding: 9px 12px; border: 2px solid var(--ink); background: var(--blue); border-radius: 8px;
                   cursor: pointer; font-size: 13px; font-weight: 700; color: var(--ink); }
  .search button:disabled { opacity: .5; cursor: default; }
  .results-dropdown { position: absolute; z-index: 500; left: 0; right: 0; background: #fff; border: 2px solid var(--ink);
                      border-radius: 8px; margin-top: 4px; box-shadow: 0 6px 18px rgba(0,0,0,.12); max-height: 240px; overflow-y: auto; }
  /* A found place is not yet a target or a home: you say which when you pick
     it, so there is no mode to have set wrongly before you started typing. */
  .results-dropdown .result { padding: 8px 10px; font-size: 13px; border-bottom: 1px solid #f0f1f4; }
  .results-dropdown .result:last-child { border-bottom: none; }
  .result-name { display: block; margin-bottom: 6px; overflow-wrap: anywhere; }
  .result-actions { display: flex; gap: 6px; }
  .result-actions button { flex: 1; padding: 5px 6px; border: 2px solid var(--ink); border-radius: 6px;
                           background: #fff; color: var(--ink); font-size: 11px; font-weight: 700; cursor: pointer;
                           display: flex; align-items: center; justify-content: center; gap: 5px; }
  .result-actions .place-icon { width: 13px; height: 14px; }
  .result-actions button.target:hover { background: var(--target); }
  .result-actions button.living:hover { background: var(--living); }
  .add-row { display: flex; gap: 8px; margin-top: 10px; }
  .add-row button { flex: 1; padding: 9px; border: 2px solid var(--ink); background: #fff; border-radius: 8px;
                    cursor: pointer; font-size: 13px; font-weight: 700; color: var(--ink);
                    display: flex; align-items: center; justify-content: center; gap: 7px; }
  /* The pin and the house, from /icons/. Same treatment as the transport
     glyphs: a fixed box, contained, because the two differ in aspect ratio. */
  .place-icon { width: 15px; height: 16px; object-fit: contain; flex: none; }
  /* Both fills are bright, so the label stays black rather than going white. */
  .add-row button.active { box-shadow: inset 0 0 0 2px #fff; }
  .add-row button.target.active { background: var(--target); }
  .add-row button.living.active { background: var(--living); }
  .hint { font-size: 11px; color: var(--muted); margin-top: 6px; min-height: 14px; }
  .card { border: 2px solid var(--ink); border-radius: 10px; padding: 10px; margin-bottom: 8px; background: #fff; }
  .card .name { font-size: 13px; font-weight: 600; margin-bottom: 6px; word-break: break-word; }
  .card .name label { display: flex; gap: 6px; align-items: flex-start; cursor: pointer; }
  .card .name input[type=checkbox] { margin: 2px 0 0; cursor: pointer; }
  .card.off { background: #fafbfc; }
  .card.off .name, .card.off .row { opacity: .5; }
  .card.off .name input[type=checkbox] { opacity: 1; }
  .card .row { display: flex; gap: 8px; align-items: center; }
  .card select, .card input { padding: 5px 6px; border: 2px solid var(--ink); border-radius: 6px; font-size: 12px; }
  .card input[type=number] { width: 58px; }
  .card .del { margin-left: auto; border: none; background: none; color: var(--muted); cursor: pointer; font-size: 16px; }
  /* The score badge only needs to sit beside the name and the weekly total.
     The per-target detail hangs below at the card's full width, rather than
     being indented into a narrow column with dead space under the badge. */
  .living-card { display: block; }
  .living-head { display: flex; gap: 10px; align-items: flex-start; }
  .living-head[role=button] { cursor: pointer; }
  .living-card:not(.open) .legs { display: none; }
  .score { flex: 0 0 auto; min-width: 46px; padding: 3px 0; border-radius: 11px; border: 2px solid var(--ink);
           color: var(--ink); text-align: center;
           font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .score.na, .living-marker.na { background: #e6eaf0; color: var(--muted); }
  /* min-width:0 or the body refuses to shrink below its min-content width and
     shoves the remove button out past the card's right edge. */
  .living-body { flex: 1; min-width: 0; }
  .weekly { font-size: 15px; font-weight: 700; }
  .weekly small { font-weight: 400; color: var(--muted); font-size: 11px; }
  .breakdown { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .legs { margin-top: 8px; border-top: 1px solid var(--border); padding-top: 4px; }
  .leg { padding: 4px 0; border-bottom: 1px dashed #eef0f3; }
  .leg:last-child { border-bottom: none; }
  .leg-top { display: flex; align-items: baseline; gap: 8px; font-size: 12px; }
  /* Flexible, not a fixed width: the score badge indents the body, and a fixed
     column pushed the time out past the card's edge. */
  .leg-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .leg-total { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .leg-total.na { font-weight: 400; color: var(--muted); font-style: italic; }
  .leg.off .leg-name, .leg.off .leg-sub { opacity: .55; }
  .leg.off .leg-total { font-weight: 400; color: var(--muted); font-style: italic; }
  .leg-sub { font-size: 11px; color: var(--muted); margin-top: 1px; font-variant-numeric: tabular-nums;
             overflow-wrap: anywhere; }
  .empty { font-size: 12px; color: var(--muted); font-style: italic; }
  .warn { background: #fff6e5; border: 2px solid var(--ink); color: #7a4f00; padding: 8px 10px; border-radius: 8px;
          font-size: 12px; margin: 12px 16px; }
  /* Failures used to go to the console only, which left a visitor staring at an
     app that had quietly stopped working. Say what happened, in the sidebar. */
  .err { background: #ffe3e0; border: 2px solid var(--ink); color: #8a1f16; padding: 8px 10px; border-radius: 8px;
         font-size: 12px; margin: 12px 0 0; }
  /* Transport icons (/icons/*.svg). Their source aspect ratios differ — 60×40
     for the bike, 36×50 for the train — so they get a fixed box and are
     contained inside it rather than sized by one dimension. */
  .mode-icon { width: 18px; height: 14px; object-fit: contain; vertical-align: -2px; flex: none; }
  .leg-name .mode-icon { width: 15px; height: 12px; vertical-align: -1px; }
  .marker-pin .mode-icon { width: 18px; height: 16px; vertical-align: 0; }
  .marker-pin { width: 30px; height: 30px; border-radius: 50%; background: var(--target); border: 3px solid var(--ink);
                display: flex; align-items: center; justify-content: center; line-height: 1;
                box-shadow: 0 1px 4px rgba(0,0,0,.35); }
  .marker-pin.off { background: #e6eaf0; opacity: .55; }
  .leaflet-popup-content { margin: 10px 12px; font-size: 13px; }
  /* Match the outlined look of the cards and markers. */
  .leaflet-popup-content-wrapper { border: 2px solid var(--ink); border-radius: 10px; }
  .leaflet-popup-tip { border: 2px solid var(--ink); }
  /* The popup is already a framed box: let the card inside it go borderless. */
  .card-popup .card { border: none; border-radius: 0; padding: 0; margin: 0; }
  .card-popup .card .name { padding-right: 16px; }  /* clear of the popup close button */
  /* Keep the remove button on its own line, far from the ✕ that closes the
     popup, and spell it out so the two can't be confused. Targets need this as
     much as homes do — a bare ✕ next to the popup's own ✕ is a trap. */
  .card-popup .living-head, .card-popup .card .row { flex-wrap: wrap; }
  .card-popup .del { flex: 0 0 100%; margin: 8px 0 0; text-align: right;
                     font-size: 11px; font-weight: 600; color: #b3261e; }
  .card-popup .del::after { content: " Remove"; }
  .living-marker { width: 44px; height: 24px; border-radius: 12px; background: var(--living); color: var(--ink);
                   border: 3px solid var(--ink);
                   display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700;
                   box-shadow: 0 1px 4px rgba(0,0,0,.4); transition: transform .12s ease, box-shadow .12s ease; }
  /* Hovering a home in the sidebar makes its marker pop out of the map. The
     card is already black-bordered, so it tints instead of changing colour. */
  #living .card:hover { background: rgba(25,255,109,.16); }
  .leaflet-marker-icon.highlight { z-index: 1000 !important; }
  .highlight .living-marker { transform: scale(1.3);
                              box-shadow: 0 0 0 5px rgba(25,255,109,.45), 0 2px 8px rgba(0,0,0,.45); }
  .cog-marker { width: 26px; height: 26px; border-radius: 50%; background: #fff; border: 3px dashed var(--cog);
                color: var(--cog); display: flex; align-items: center; justify-content: center;
                font-size: 14px; line-height: 1; box-shadow: 0 1px 4px rgba(0,0,0,.3); }

  /* Phones. The 360px sidebar sitting next to a 100vh map is a desktop layout,
     and a link shared with someone is mostly opened on a phone — so stack the
     map above the list instead. dvh, because mobile browser chrome eats vh. */
  @media (max-width: 760px) {
    #app { flex-direction: column; height: 100vh; height: 100dvh; }
    #map { order: -1; flex: none; height: 45vh; height: 45dvh; min-height: 200px; }
    #sidebar { width: auto; min-width: 0; flex: 1; min-height: 0;
               border-right: none; border-top: 2px solid var(--ink); }
    header { padding: 10px 14px; }
    header p { display: none; }
    .scroll { padding: 10px 14px; }
    /* 16px or iOS zooms the whole page in when the field takes focus. */
    .search input { font-size: 16px; }
    .leg-name { width: auto; flex: 1; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <header>
      <h1><img src="/icon.png" alt="" width="24" height="25" />Residence Optimizer</h1>
      <p>Score potential homes by total weekly commute time.</p>
    </header>
    <div id="keywarn" class="warn" style="display:none">
      No routing API key configured. Add <code>ORS_API_KEY</code> to <code>.env</code> and restart.
    </div>
    <div class="scroll">
      <!-- Submit-only search: OpenStreetMap's geocoder forbids auto-complete,
           so nothing is sent until you press Enter or the button. -->
      <form class="search" id="searchForm" autocomplete="off">
        <input id="search" placeholder="Search a place…" autocomplete="off" aria-label="Search a place" />
        <button type="submit" id="searchBtn">Search</button>
        <div id="searchResults" class="results-dropdown" style="display:none"></div>
      </form>
      <div id="error" class="err" style="display:none"></div>
      <div class="add-row">
        <button id="addTargetBtn" class="target"><img class="place-icon" src="/icons/target.svg" alt="" />Add target</button>
        <button id="addLivingBtn" class="living"><img class="place-icon" src="/icons/home.svg" alt="" />Add home</button>
      </div>
      <div class="hint" id="hint">Search a place above, or use these to drop one on the map.</div>

      <div class="section-title">Target places <span id="tcount"></span></div>
      <div id="targets"></div>

      <div class="section-title">Potential homes <span id="lcount"></span></div>
      <div id="living"></div>
    </div>
  </div>
  <div id="map"></div>
</div>

<script src="/vendor/leaflet/leaflet.js"></script>
<script>
const MODES = {
  car:     { icon: "/icons/car.svg",   label: "Car" },
  bike:    { icon: "/icons/bike.svg",  label: "Bike" },
  foot:    { icon: "/icons/walk.svg",  label: "Foot" },
  transit: { icon: "/icons/train.svg", label: "Transit" },
};

// Drawn icons rather than emoji: emoji render differently on every platform,
// and these match the app's flat black line work. The label doubles as alt
// text — in a leg row the icon is the only thing naming the mode.
function modeIcon(mode) {
  const m = MODES[mode];
  return `<img class="mode-icon" src="${m.icon}" alt="${m.label}" title="${m.label}" />`;
}

// Rough door-to-door speeds (km/h), only used to weight the centre of gravity:
// a slower mode costs more time per km, so it pulls the centre harder.
// transit is overwritten at startup with the server's TRANSIT_SPEED_KMH.
const MODE_SPEED_KMH = { car: 50, bike: 15, foot: 5, transit: 20 };

// How many places one comparison may hold. The server enforces the real caps
// and tells us its numbers at startup; these are just the sane defaults.
let LIMITS = { targets: 25, living: 25 };

let state = { targets: [], living: [] };
let placing = null;               // "target" | "living" | null
let lastResults = [];             // ranking from server, keyed by living index
let markers = { targets: {}, living: {}, cog: null, cogLines: [] };

function load() {
  try { state = JSON.parse(localStorage.getItem("residence-optimizer") || "") || state; } catch (e) {}
  if (!state.targets) state.targets = [];
  if (!state.living) state.living = [];
  // Targets saved before the include/exclude toggle existed are counted.
  state.targets.forEach((t) => { if (t.enabled === undefined) t.enabled = true; });
}
function save() { localStorage.setItem("residence-optimizer", JSON.stringify(state)); }
const uid = () => Math.random().toString(36).slice(2, 9);

// ---------- Map ----------
const map = L.map("map").setView([48.8566, 2.3522], 12);
// The {s} subdomain form is deprecated; the single host is what OSM's tile
// policy asks for now. Attribution has to be a link to satisfy the ODbL.
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution:
    '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' +
    ' &middot; routing by <a href="https://openrouteservice.org">OpenRouteService</a>',
  maxZoom: 19,
}).addTo(map);

map.on("click", (e) => {
  if (!placing) return;
  addPlace(placing, e.latlng.lat, e.latlng.lng);
  setPlacing(null);
});

function setPlacing(mode) {
  placing = mode;
  document.getElementById("addTargetBtn").classList.toggle("active", mode === "target");
  document.getElementById("addLivingBtn").classList.toggle("active", mode === "living");
  document.getElementById("map").style.cursor = mode ? "crosshair" : "";
  document.getElementById("hint").textContent = mode
    ? `Click on the map to place a ${mode === "target" ? "target" : "home"}.`
    : "Search a place above, or use these to drop one on the map.";
}

function addPlace(kind, lat, lng, name) {
  const list = kind === "target" ? state.targets : state.living;
  const cap = kind === "target" ? LIMITS.targets : LIMITS.living;
  if (list.length >= cap) {
    showError(`Up to ${cap} ${kind === "target" ? "targets" : "homes"} at a time — remove one first.`);
    return false;
  }
  name = name || `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
  if (kind === "target") {
    state.targets.push({ id: uid(), name, lat, lng, mode: "car", trips: 3, enabled: true });
  } else {
    state.living.push({ id: uid(), name, lat, lng });
  }
  save(); render(); compute();
  return true;
}

// ---------- Rendering ----------
function render() {
  renderTargets();
  renderLiving();
  renderMarkers();
  document.getElementById("tcount").textContent = state.targets.length || "";
  document.getElementById("lcount").textContent = state.living.length || "";
}

// Cards are built once and used in two places: the sidebar lists and the map
// popups. Their controls are wired through delegated listeners on <body>, so a
// card behaves identically wherever it is shown.
function targetCard(t) {
  const card = document.createElement("div");
  card.className = "card" + (t.enabled ? "" : " off");
  card.innerHTML = `
    <div class="name">
      <label title="Count this target in the commute totals">
        <input type="checkbox" class="enabled" data-id="${t.id}" ${t.enabled ? "checked" : ""} />
        <span>${modeIcon(t.mode)} ${escapeHtml(shortName(t.name))}</span>
      </label>
    </div>
    <div class="row">
      <select data-id="${t.id}" class="mode">
        ${Object.entries(MODES).map(([k, v]) => `<option value="${k}" ${k === t.mode ? "selected" : ""}>${v.label}</option>`).join("")}
      </select>
      <input type="number" min="0" step="1" value="${t.trips}" data-id="${t.id}" class="trips" title="round trips / week" />
      <span style="font-size:11px;color:var(--muted)">×/week</span>
      <button class="del" data-id="${t.id}" data-kind="target" title="Remove">✕</button>
    </div>`;
  return card;
}

function livingCard(h, res) {
  const card = document.createElement("div");
  // The per-target breakdown is long and repeats itself down a list of twenty
  // homes, so it starts folded away: the score, the name and the weekly total
  // are what you scan by, and the detail is one click off.
  const detail = res ? renderLegs(res) : "";
  const open = !!detail && expandedHomes.has(h.id);
  card.className = "card living-card" + (open ? " open" : "");
  card.dataset.id = h.id;  // lets the sidebar tie a hovered card to its marker
  let weekly = `<span class="empty">—</span>`;
  if (res && res.weekly_minutes != null) {
    weekly = `<span class="weekly">${fmtDuration(res.weekly_minutes)} <small>/ week total</small></span>`;
  } else if (res && !res.reachable) {
    weekly = `<span class="empty">some targets unreachable</span>`;
  }
  const fold = detail
    ? ` role="button" tabindex="0" aria-expanded="${open}" title="Time spent on each target"`
    : "";
  card.innerHTML = `
    <div class="living-head"${fold}>
      ${scoreBadge(res && res.score_pct, "score")}
      <div class="living-body">
        <div class="name">${escapeHtml(shortName(h.name))}</div>
        ${weekly}
      </div>
      <button class="del" data-id="${h.id}" data-kind="living" title="Remove">✕</button>
    </div>
    ${detail}`;
  return card;
}

// Which homes are unfolded. Kept outside `state` because it is a view detail,
// not something worth saving — but outside the DOM too, so a re-render (a new
// result, an edited target) does not snap everything shut again.
const expandedHomes = new Set();

function setFold(id, open) {
  if (open) expandedHomes.add(id); else expandedHomes.delete(id);
  // The same card can be on screen twice — in the list and in a map popup.
  document.querySelectorAll(`.living-card[data-id="${id}"]`).forEach((card) => {
    card.classList.toggle("open", open);
    const head = card.querySelector(".living-head[role=button]");
    if (head) head.setAttribute("aria-expanded", String(open));
  });
}
function toggleHome(id) { setFold(id, !expandedHomes.has(id)); }

// Server result for a home, by its position in state.living (null until computed).
function resultOf(idx) { return lastResults.find((r) => r.index === idx) || null; }
// Rank of a home in the results, i.e. where it sits in the best-first order.
function orderOf(idx) {
  const i = lastResults.findIndex((r) => r.index === idx);
  return i < 0 ? Infinity : i;
}

function renderTargets() {
  const el = document.getElementById("targets");
  if (!state.targets.length) { el.innerHTML = `<div class="empty">No targets yet.</div>`; return; }
  el.innerHTML = "";
  state.targets.forEach((t) => el.appendChild(targetCard(t)));
}

function renderLiving() {
  const el = document.getElementById("living");
  if (!state.living.length) { el.innerHTML = `<div class="empty">No homes yet.</div>`; return; }
  el.innerHTML = "";
  // Best first: shortest weekly commute at the top, then unscored/unreachable.
  state.living
    .map((h, idx) => ({ h, idx }))
    .sort((a, b) => orderOf(a.idx) - orderOf(b.idx))
    .forEach(({ h, idx }) => el.appendChild(livingCard(h, resultOf(idx))));
}

// Score badge: 100% = shortest total commute, 50% = twice as long.
// Coloured green→red so near-equal homes look near-equal.
function scoreBadge(pct, cls) {
  if (pct == null) return `<div class="${cls} na" title="Not computed yet">—</div>`;
  // 60% and below is red, and the top of the ramp lands exactly on the icon's
  // green (#19FF6D = hsl(142,100%,55%)) so the best home matches the branding.
  const k = Math.max(0, Math.min(1, (pct - 60) / 40));
  const bg = `hsl(${Math.round(4 + k * 138)}, ${Math.round(66 + k * 34)}%, ${Math.round(50 + k * 5)}%)`;
  // Black on the red end is hard to read, so the badge flips to white there.
  // The red is deepened to 50% lightness to give that white something to sit
  // on; by 70% the ramp has warmed up enough for black to be the clearer of
  // the two again.
  const fg = pct < 70 ? "#fff" : "var(--ink)";
  return `<div class="${cls}" style="background:${bg};color:${fg}" title="Relative to the best home">${pct}%</div>`;
}

// Per-target detail for one home: one-way time, and the cumulated time
// (round trip × trips per week) it adds to the weekly total.
function renderLegs(res) {
  const rows = state.targets.map((t, ti) => {
    const b = (res.breakdown || [])[ti];
    const name = `${modeIcon(t.mode)} ${escapeHtml(shortName(t.name))}`;
    const off = t.enabled ? "" : " off";
    if (!b || b.one_way_min == null) {
      return `<div class="leg${off}"><div class="leg-top">
          <span class="leg-name">${name}</span>
          <span class="leg-total na">${t.enabled ? "no route" : "not counted"}</span>
        </div></div>`;
    }
    return `<div class="leg${off}">
        <div class="leg-top">
          <span class="leg-name">${name}</span>
          <span class="leg-total">${t.enabled ? fmtDuration(b.weekly_min) : "not counted"}</span>
        </div>
        <div class="leg-sub">${fmtDuration(b.one_way_min)} one way ·
          round trip ${fmtDuration(b.round_trip_min)} × ${fmtNum(b.trips)}/week</div>
      </div>`;
  }).join("");
  return `<div class="legs">${rows}</div>`;
}

// Centre of gravity of the counted targets, weighted by the travel time each
// one costs per kilometre: weight = trips per week ÷ speed of its mode. Going
// somewhere twice as often, or on foot instead of by car, pulls it in harder.
// Purely geometric — it's a hint of where to look, not a routed result.
function centerOfGravity() {
  let sumW = 0, lat = 0, lng = 0, counted = 0;
  state.targets.forEach((t) => {
    if (!t.enabled) return;
    const w = (Number(t.trips) || 0) / (MODE_SPEED_KMH[t.mode] || 50);
    if (w <= 0) return;
    sumW += w; lat += t.lat * w; lng += t.lng * w; counted++;
  });
  if (!sumW) return null;
  return { lat: lat / sumW, lng: lng / sumW, counted };
}

// Popups hold a live card, so it is rebuilt from current state on every open.
const CARD_POPUP = { minWidth: 260, maxWidth: 320, className: "card-popup" };

function renderMarkers() {
  // Everything is rebuilt from scratch, so remember which popup was open and
  // put it back afterwards — editing from a popup must not close it.
  const open = ["targets", "living"].flatMap((kind) =>
    Object.entries(markers[kind]).filter(([, m]) => m.isPopupOpen()).map(([id]) => ({ kind, id })));

  Object.values(markers.targets).forEach((m) => map.removeLayer(m));
  Object.values(markers.living).forEach((m) => map.removeLayer(m));
  if (markers.cog) map.removeLayer(markers.cog);
  markers.cogLines.forEach((l) => map.removeLayer(l));
  markers = { targets: {}, living: {}, cog: null, cogLines: [] };

  state.targets.forEach((t) => {
    const icon = L.divIcon({
      className: "",
      html: `<div class="marker-pin${t.enabled ? "" : " off"}">${modeIcon(t.mode)}</div>`,
      iconSize: [30, 30], iconAnchor: [15, 15],
    });
    markers.targets[t.id] = L.marker([t.lat, t.lng], { icon }).addTo(map)
      .bindPopup(() => targetCard(t), CARD_POPUP);
  });
  state.living.forEach((h, idx) => {
    const icon = L.divIcon({
      className: "",
      html: scoreBadge((resultOf(idx) || {}).score_pct, "living-marker"),
      iconSize: [42, 22], iconAnchor: [21, 11],
    });
    markers.living[h.id] = L.marker([h.lat, h.lng], { icon }).addTo(map)
      // Clicking a home on the map means you want that home's numbers, so its
      // popup comes up unfolded — and the list copy follows, since the two are
      // one card. Folding it back from either place still works.
      .bindPopup(() => { setFold(h.id, true); return livingCard(h, resultOf(idx)); }, CARD_POPUP);
  });

  open.forEach(({ kind, id }) => {
    if (markers[kind][id]) markers[kind][id].openPopup();
  });

  // Centre of gravity, tied to every target it accounts for by a dotted line.
  const cog = centerOfGravity();
  if (cog) {
    state.targets.forEach((t) => {
      if (!t.enabled || !(Number(t.trips) > 0)) return;
      markers.cogLines.push(L.polyline([[cog.lat, cog.lng], [t.lat, t.lng]], {
        // --cog spelled out: this is an SVG stroke, so no CSS variable.
        color: "#12161c", weight: 2, opacity: .75, dashArray: "3 6", interactive: false,
      }).addTo(map));
    });
    const icon = L.divIcon({
      className: "", html: `<div class="cog-marker">◎</div>`,
      iconSize: [26, 26], iconAnchor: [13, 13],
    });
    markers.cog = L.marker([cog.lat, cog.lng], { icon, zIndexOffset: -200 })
      .addTo(map)
      .bindPopup(`<b>Centre of gravity</b><br />${cog.counted} target${cog.counted > 1 ? "s" : ""},
        weighted by frequency and transport mode.`);
  }
}

// ---------- Compute ----------
let computeTimer = null;
function compute() {
  clearTimeout(computeTimer);
  computeTimer = setTimeout(doCompute, 400);
}
async function doCompute() {
  if (!state.living.length || !state.targets.length) { lastResults = []; renderLiving(); renderMarkers(); return; }
  try {
    const r = await fetch("/api/compute", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        living: state.living.map((h) => ({ lat: h.lat, lng: h.lng })),
        targets: state.targets.map((t) => ({
          lat: t.lat, lng: t.lng, mode: t.mode, trips: Number(t.trips) || 0, enabled: !!t.enabled,
        })),
      }),
    });
    if (!r.ok) {
      // Rate limits, an exhausted daily allowance, a routing outage: whatever
      // it is, the last thing to do is fail silently and look broken.
      showError(await errorText(r, "Could not compute travel times."));
      return;
    }
    clearError();
    lastResults = (await r.json()).results || [];
    renderLiving(); renderMarkers();
  } catch (e) {
    showError("Could not reach the server. Check your connection.");
  }
}

// ---------- Search / geocode ----------
const searchInput = document.getElementById("search");
const searchResults = document.getElementById("searchResults");
const searchBtn = document.getElementById("searchBtn");

// Geocoding runs on submit only — never per keystroke. OpenStreetMap's
// Nominatim is free and shared, and its usage policy rules out using it for
// auto-complete; a debounce would not have made that any less true.
document.getElementById("searchForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const q = searchInput.value.trim();
  if (q.length < 3) return;
  searchBtn.disabled = true;
  searchBtn.textContent = "…";
  try {
    const r = await fetch("/api/geocode", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query: q }),
    });
    if (!r.ok) { showError(await errorText(r, "The place search failed.")); return; }
    clearError();
    const items = await r.json();
    if (!items.length) { searchResults.style.display = "none"; showError(`No place found for “${q}”.`); return; }
    searchResults.innerHTML = "";
    items.forEach((it) => {
      const row = document.createElement("div");
      row.className = "result";
      // type="button", or these would submit the search form they sit in.
      row.innerHTML = `<span class="result-name"></span>
        <span class="result-actions">
          <button type="button" class="target"><img class="place-icon" src="/icons/target.svg" alt="" />Target</button>
          <button type="button" class="living"><img class="place-icon" src="/icons/home.svg" alt="" />Home</button>
        </span>`;
      row.querySelector(".result-name").textContent = it.name;
      row.querySelectorAll("button").forEach((b) => {
        b.onclick = () => takeResult(b.className, it);
      });
      searchResults.appendChild(row);
    });
    searchResults.style.display = "block";
  } catch (err) {
    showError("The place search is unreachable. Check your connection.");
  } finally {
    searchBtn.disabled = false;
    searchBtn.textContent = "Search";
  }
});
document.addEventListener("click", (e) => {
  if (!e.target.closest(".search")) searchResults.style.display = "none";
});

// Taking a search result is a second, complete way to add a place, so it also
// disarms the map: leaving the crosshair on used to plant an unwanted marker
// on whatever the next click landed on.
function takeResult(kind, it) {
  if (!addPlace(kind, it.lat, it.lng, it.name)) return;
  map.setView([it.lat, it.lng], 13);
  setPlacing(null);
  searchInput.value = "";
  searchResults.style.display = "none";
}

// ---------- Events ----------
// These arm the map only. What a searched place becomes is chosen on the
// result itself, so there is no hidden "current type" to get wrong.
document.getElementById("addTargetBtn").onclick = () => setPlacing(placing === "target" ? null : "target");
document.getElementById("addLivingBtn").onclick = () => setPlacing(placing === "living" ? null : "living");

// Hovering a home card in the sidebar highlights its marker on the map.
// Bound to the list only, so the same card shown inside a popup stays inert.
const livingList = document.getElementById("living");
livingList.addEventListener("mouseover", (e) => hoverHome(e, true));
livingList.addEventListener("mouseout", (e) => hoverHome(e, false));
function hoverHome(e, on) {
  const card = e.target.closest(".card");
  // mouseover/mouseout also fire while moving between a card's own children.
  if (!card || (e.relatedTarget && card.contains(e.relatedTarget))) return;
  const marker = markers.living[card.dataset.id];
  const el = marker && marker.getElement();
  if (el) el.classList.toggle("highlight", on);
}

// Delegated on <body> so target cards work in the sidebar and in map popups alike.
document.body.addEventListener("change", (e) => {
  const t = state.targets.find((x) => x.id === e.target.dataset.id);
  if (!t) return;
  if (e.target.classList.contains("mode")) t.mode = e.target.value;
  if (e.target.classList.contains("trips")) t.trips = Number(e.target.value) || 0;
  if (e.target.classList.contains("enabled")) t.enabled = e.target.checked;
  save(); render(); compute();
});
document.body.addEventListener("click", (e) => {
  if (!e.target.classList.contains("del")) return;
  const { id, kind } = e.target.dataset;
  state[kind === "target" ? "targets" : "living"] =
    state[kind === "target" ? "targets" : "living"].filter((x) => x.id !== id);
  expandedHomes.delete(id);
  save(); render(); compute();
});

// Folding a home open/shut. Delegated on <body> like everything else, so it
// works from a map popup as well as from the list; the remove button sits
// inside the same header and must not count as a click on it.
document.body.addEventListener("click", (e) => {
  const head = e.target.closest(".living-head[role=button]");
  if (!head || e.target.closest(".del")) return;
  toggleHome(head.closest(".living-card").dataset.id);
});
document.body.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const head = e.target.closest(".living-head[role=button]");
  if (!head) return;
  e.preventDefault();  // Space would scroll the list
  toggleHome(head.closest(".living-card").dataset.id);
});

// ---------- Errors ----------
const errorBox = document.getElementById("error");
function showError(msg) { errorBox.textContent = msg; errorBox.style.display = "block"; }
function clearError() { errorBox.style.display = "none"; }
// The API explains itself in `detail`; fall back to something human otherwise.
async function errorText(r, fallback) {
  try {
    const body = await r.json();
    if (typeof body.detail === "string") return body.detail;
  } catch (e) {}
  return fallback;
}

// ---------- Utils ----------
function shortName(n) { return n.split(",").slice(0, 2).join(",").trim(); }
function escapeHtml(s) { return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function fmtNum(n) { return String(Number(n)); }
function fmtDuration(min) {
  min = Math.round(min);
  if (min < 60) return `${min} min`;
  const h = Math.floor(min / 60), m = min % 60;
  return m ? `${h}h${String(m).padStart(2, "0")}` : `${h}h`;
}

// ---------- Analytics ----------
// Umami is cookieless: it writes nothing to the visitor's device and collects
// no personal data, which is exactly why this app shows no cookie banner —
// there is no consent to ask for. Loaded only where one is configured, so a
// local or self-hosted copy reports nothing to anyone.
function loadAnalytics(cfg) {
  if (!cfg.umami_src || !cfg.umami_website_id) return;
  const s = document.createElement("script");
  s.src = cfg.umami_src;
  s.defer = true;
  s.setAttribute("data-website-id", cfg.umami_website_id);
  s.setAttribute("data-do-not-track", "true");  // respect the browser's DNT
  if (cfg.umami_domains) s.setAttribute("data-domains", cfg.umami_domains);
  document.head.appendChild(s);
}

// ---------- Init ----------
(async function init() {
  load();
  try {
    const cfg = await (await fetch("/api/config")).json();
    if (!cfg.has_key) document.getElementById("keywarn").style.display = "block";
    if (cfg.transit_speed_kmh > 0) MODE_SPEED_KMH.transit = cfg.transit_speed_kmh;
    if (cfg.max_targets > 0) LIMITS.targets = cfg.max_targets;
    if (cfg.max_living > 0) LIMITS.living = cfg.max_living;
    loadAnalytics(cfg);
  } catch (e) {}
  render();
  if (state.living.length || state.targets.length) {
    const all = [...state.targets, ...state.living];
    if (all.length) map.fitBounds(all.map((p) => [p.lat, p.lng]), { padding: [40, 40], maxZoom: 14 });
    compute();
  }
})();
</script>
</body>
</html>
